name: 同步上游并触发构建

# GitHub 不会因为上游仓库的 push 直接触发 fork 的工作流，因此使用轮询检查。
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: 同步 Fanju6/NetProxy-Magisk
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 fork 主分支
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 检查并合并上游提交
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: Fanju6/NetProxy-Magisk
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream main

          local_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse refs/remotes/upstream/main)"
          echo "当前 main: $local_sha"
          echo "上游 main: $upstream_sha"

          if [ "$local_sha" = "$upstream_sha" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor "$upstream_sha" "$local_sha"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '当前 fork 已包含上游提交。'
            exit 0
          fi

          if git merge-base --is-ancestor "$local_sha" "$upstream_sha"; then
            git merge --ff-only upstream/main
          else
            # 冲突策略：源码和资源以 upstream/main 为准；构建、发布、同步工作流
            # 以及它们依赖的本地 action 以本仓库为准。这样不会 force-push 改写历史，
            # 但会强制保留本仓库的构建流程。
            if git merge --no-commit --no-edit upstream/main; then
              :
            else
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicts" ]; then
                echo '合并失败但没有可自动解决的冲突，停止同步。' >&2
                exit 1
              fi
              resolve_conflict() {
                local side="$1"
                local path="$2"
                if git cat-file -e "$side:$path" 2>/dev/null; then
                  if [ "$side" = "$local_sha" ]; then
                    git checkout --ours -- "$path"
                  else
                    git checkout --theirs -- "$path"
                  fi
                else
                  git rm -f -- "$path" 2>/dev/null || git add -u -- "$path"
                fi
              }
              printf '%s\n' "$conflicts" | while IFS= read -r path; do
                case "$path" in
                  .github/workflows/*|.github/actions/*)
                    resolve_conflict "$local_sha" "$path"
                    ;;
                  *)
                    resolve_conflict upstream/main "$path"
                    ;;
                esac
              done
              git add -A
              git commit \
                -m 'ci(sync): 保留本地构建流程并强制同步上游' \
                -m '上游代码冲突时采用上游版本，保留本仓库的自动同步、构建与发布工作流。'
            fi
          fi

          # 即使上游改动没有形成 Git 冲突，也恢复本地 CI 文件，确保构建流程不会被上游覆盖。
          git checkout "$local_sha" -- \
            .github/workflows/build-release.yml \
            .github/workflows/sync-upstream.yml \
            .github/actions

          # 无论上游是否新增了工作流，最终只保留本仓库定义的两条流程。
          while IFS= read -r workflow; do
            case "$(basename "$workflow")" in
              build-release.yml|sync-upstream.yml) ;;
              *) git rm -f -- "$workflow" ;;
            esac
          done < <(
            find .github/workflows -maxdepth 1 -type f \
              \( -name '*.yml' -o -name '*.yaml' \) -print
          )
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: 只保留同步与双资产构建流程'
          fi

          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "synced_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 显式触发构建与发布
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-release.yml --repo "$GITHUB_REPOSITORY" --ref main
