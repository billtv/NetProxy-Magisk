name: 发布（Release）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: 构建并发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 构建并打包模块
        id: pack
        uses: ./.github/actions/build-module

      - name: 构建并签名管理器 APK
        id: manager
        uses: ./.github/actions/build-manager

      - name: 清理 Release 中多余的旧资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          STANDARD_NAME: ${{ steps.pack.outputs.standard_name }}
          APK_NAME: ${{ steps.manager.outputs.apk_name }}
        run: |
          set -euo pipefail

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id' 2>/dev/null || true)"
          [ -n "$release_id" ] || exit 0

          while IFS="$(printf '\t')" read -r asset_id asset_name; do
            case "$asset_name" in
              "$STANDARD_NAME"|"$APK_NAME") ;;
              *) gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" ;;
            esac
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq '.[] | [.id, .name] | @tsv'
          )

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          STANDARD_NAME: ${{ steps.pack.outputs.standard_name }}
          APK_NAME: ${{ steps.manager.outputs.apk_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NetProxy $RELEASE_TAG" \
              --notes-file docs/changelog.md
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NetProxy $RELEASE_TAG" \
              --notes-file docs/changelog.md
          fi

          gh release upload "$RELEASE_TAG" \
            "$STANDARD_NAME" \
            "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: 发布通知到 Telegram
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          thread-id: 2343
          parse-mode: markdown
          message: |
            **新版本发布通知**

            版本: `${{ github.ref_name }}`

            [查看更新日志并下载](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})

            **直接下载:**
            [标准包](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.pack.outputs.standard_name }})
            [管理器 APK](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.manager.outputs.apk_name }})

      - name: 触发同步到 KernelSU 仓库
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # release:published 由 GITHUB_TOKEN 创建，受防递归限制不会自动触发 sync 工作流；
        # 故在此显式 dispatch（workflow_dispatch 是该限制的官方例外，GITHUB_TOKEN 可触发）。
        run: gh workflow run sync-kernelsu.yml

      - name: 失败通知
        if: failure()
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          thread-id: 2275
          parse-mode: markdown
          message: |
            **发布工作流执行失败！**

            标签: `${{ github.ref_name }}`

            [点击查看构建日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
