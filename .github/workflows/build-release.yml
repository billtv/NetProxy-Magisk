name: 自动构建并发布

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 验证 Go、Shell、WebUI 与 Android
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/native/netproxy/go.mod
          cache-dependency-path: src/native/netproxy/go.sum

      - name: 执行 Go 与 Shell 契约测试
        run: sh tests/ci_verify.sh

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/webui/package-lock.json

      - name: 构建 WebUI
        working-directory: src/webui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 配置 Android 构建环境
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android SDK 组件
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' --channel=1

      - name: 执行 Android 单元测试与 Lint
        working-directory: src/android
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

  build:
    name: 构建并发布两个资产
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置构建元信息
        shell: bash
        run: |
          echo "TIMESTAMP=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          echo "SHORT_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "COMMIT_MESSAGE=$(git log -1 --format=%s "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: 构建标准模块 ZIP
        id: pack
        uses: ./.github/actions/build-module

      - name: 构建自签名管理器 APK
        id: manager
        uses: ./.github/actions/build-manager

      - name: 发布模块 ZIP 与管理器 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          IS_STABLE: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
          STANDARD_NAME: ${{ steps.pack.outputs.standard_name }}
          APK_NAME: ${{ steps.manager.outputs.apk_name }}
          VERSION: ${{ steps.pack.outputs.version }}
          COMMIT_COUNT: ${{ steps.pack.outputs.commit_count }}
        shell: bash
        run: |
          set -euo pipefail

          cleanup_assets() {
            local release_id="$1"
            while IFS="$(printf '\t')" read -r asset_id asset_name; do
              case "$asset_name" in
                "$STANDARD_NAME"|"$APK_NAME") ;;
                *) gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" ;;
              esac
            done < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
                --jq '.[] | [.id, .name] | @tsv'
            )
          }

          if [ "$IS_STABLE" != 'true' ]; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            sleep 2
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title 'nightly Pre-release' \
              --notes "同步最新代码变更，仅保留最新版本的构建产物。

          版本: \`$VERSION\` (build $COMMIT_COUNT)
          构建时间: $TIMESTAMP
          提交: \`$SHORT_HASH\`" \
              "$STANDARD_NAME" \
              "$APK_NAME"
            exit 0
          fi

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id' 2>/dev/null || true)"
          if [ -n "$release_id" ]; then
            cleanup_assets "$release_id"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NetProxy $RELEASE_TAG" \
              --notes-file docs/changelog.md
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NetProxy $RELEASE_TAG" \
              --notes-file docs/changelog.md
          fi

          gh release upload "$RELEASE_TAG" \
            "$STANDARD_NAME" \
            "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
