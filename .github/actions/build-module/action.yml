name: 构建并打包模块
description: 构建 WebUI、写入 versionCode，并打出标准模块包

# 被 build-release.yml 复用的共享打包逻辑（调用前需已 checkout，且 fetch-depth: 0 以便统计提交数）
outputs:
  version:
    description: 模块版本号（取自 module.prop 的 version=）
    value: ${{ steps.meta.outputs.version }}
  commit_count:
    description: 提交数，用作 versionCode
    value: ${{ steps.meta.outputs.commit_count }}
  standard_name:
    description: 标准包文件名
    value: ${{ steps.meta.outputs.standard_name }}

runs:
  using: composite
  steps:
    - name: 配置 Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/native/netproxy/go.mod
        cache-dependency-path: src/native/netproxy/go.sum

    - name: 构建 NetProxy 原生组件
      shell: bash
      working-directory: src/native/netproxy
      run: |
        set -euo pipefail
        go test ./...

        version="$(sed -n 's/^version=//p' ../../module/module.prop | head -n 1)"
        commit="$(git -C ../../.. rev-parse --short HEAD)"
        output_cli="../../module/bin/netproxyctl"

        CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -v \
          -trimpath \
          -buildvcs=false \
          -pgo=auto \
          -ldflags="-s -w -buildid= -X main.version=${version} -X main.commit=${commit}" \
          -o "$output_cli" \
          ./cmd/netproxyctl

        test -s "$output_cli"
        chmod 0755 "$output_cli"
        file "$output_cli" | grep -q 'ARM aarch64'
        go version -m "$output_cli" | grep -q 'github.com/reF1nd/sing-box'
        go version -m "$output_cli" | grep -q -- '-pgo=default.pgo'

    - name: 配置 Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: src/webui/package-lock.json

    - name: 构建 WebUI（产物 → src/module/webroot/netproxy）
      shell: bash
      working-directory: src/webui
      run: |
        npm ci
        npm run build

    - name: 计算版本并写入 module.prop
      id: meta
      shell: bash
      run: |
        COMMIT_COUNT=$(git rev-list --count HEAD)
        sed -i "s/^versionCode=.*/versionCode=$COMMIT_COUNT/" src/module/module.prop
        VERSION=$(grep '^version=' src/module/module.prop | cut -d= -f2)
        {
          echo "version=$VERSION"
          echo "commit_count=$COMMIT_COUNT"
          echo "standard_name=NetProxy_${VERSION}_${COMMIT_COUNT}.zip"
        } >> "$GITHUB_OUTPUT"

    - name: 打包标准模块
      shell: bash
      working-directory: src/module
      env:
        STANDARD_NAME: ${{ steps.meta.outputs.standard_name }}
      run: |
        # 管理器 APK 作为独立 Release 资产发布，标准模块包不内置该 APK。
        7z a -tzip -mx=9 "../../$STANDARD_NAME" . -x!"NetProxy.apk"
